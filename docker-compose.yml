services:
  daemon:
    build:
      context: .
      dockerfile: packages/daemon/Dockerfile
    command: ['npm', 'run', 'dev', '--workspace=crew-daemon']
    volumes:
      # Source bind-mounts for hot-reload via tsx watch
      - ./packages/daemon/src:/app/packages/daemon/src
      - ./packages/shared/src:/app/packages/shared/src
      # Anonymous volume preserves npm ci output from being clobbered
      - /app/node_modules
      # Canonical persistent state
      - crew-state:/state
      # Read-only: real-agent transcript JSONLs for IngestService.
      # Worktree compose overrides this; canonical reads host transcripts.
      - ${HOME}/.claude/projects:/root/.claude/projects:ro
      # Read-only: registered-project TOMLs the ProjectsService reads on /api/projects.
      # Without this mount the daemon sees an empty config dir and the dashboard
      # silently filters every agent away (AgentsList.tsx joins on projectName).
      - ${HOME}/.config/crew/projects:/root/.config/crew/projects:ro
      # Read-only: one-off host-authored scripts (e.g. baseline-metrics-capture)
      # that need both the canonical DB (crew-state volume) and host transcripts.
      # Daemon image itself doesn't ship these; bind keeps them outside the build.
      - ./scripts:/app/scripts:ro
      # Read-only: CLI startup-phase JSONL events (CREW-201). The CLI writes
      # ~/.crew/startup/<key>.jsonl from the host on dispatch; the daemon's
      # chokidar watcher ingests them into startup_events.
      - ${HOME}/.crew/startup:/root/.crew/startup:ro
      # Read-only: concrete state-event JSONL log (CREW-254). Producers (CLI
      # run/fix-pr/finish, runner-exit, the pr-create PostToolUse hook) write
      # ~/.crew/state-events/<key>.jsonl from the host; the daemon's chokidar
      # watcher reduces them into state_transitions.
      - ${HOME}/.crew/state-events:/root/.crew/state-events:ro
      # Read-only: host runner log (CREW-215). The host runner process writes
      # ~/.crew/runner/runner.log; GET /api/runner/logs tails it. One runner
      # per host, so all stacks (canonical + worktree) bind the same host
      # path — worktree stacks just have no runner writing to it.
      - ${HOME}/.crew/runner:/root/.crew/runner:ro
      # Read-only: host `gh` CLI auth so PrPoller's `gh pr view` calls
      # (CREW-202) inherit the user's token without an in-container login.
      # Daemon image installs gh; this mounts the credentials.
      - ${HOME}/.config/gh:/root/.config/gh:ro
      # Read-only: per-repo GitHub webhook HMAC secrets (CREW-269). The daemon
      # loads these at boot to verify pull_request webhook deliveries. Host path
      # mirrors the other ~/.config/crew mounts; os.homedir() == /root in the
      # container resolves to the same logical location. The file must exist as a
      # *file* before `docker compose up` (a bind mount of a missing path makes
      # Docker create a directory) — see docs/runbooks/github-webhook-funnel.md.
      - ${HOME}/.config/crew/github-webhook-secrets.toml:/root/.config/crew/github-webhook-secrets.toml:ro
    environment:
      - CREW_DB_FILE=/state/state.db
      - CREW_HOST=0.0.0.0
      - CREW_PORT=7773
      - CREW_SEED_FIXTURES=${CREW_SEED_FIXTURES:-0}
    ports:
      - '${CREW_PORT:-7773}:7773'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:7773/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped

  dashboard:
    profiles: [dev]
    build:
      context: .
      dockerfile: packages/dashboard/Dockerfile
    command: ['npm', 'run', 'dev', '--workspace=crew-dashboard']
    volumes:
      - ./packages/dashboard/src:/app/packages/dashboard/src
      - /app/node_modules
    environment:
      - CREW_DAEMON_URL=http://daemon:7773
    ports:
      - '${CREW_VITE_PORT:-5173}:5173'
    depends_on:
      daemon:
        condition: service_healthy
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped

volumes:
  crew-state:
